# url   = "https://www.facebook.com/marketplace/ANDERE_ID/search/?..."

[[suche]]
name  = "San Fernando, Cebu"
aktiv = true   # deaktiviert ohne löschen
url   = "https://www.facebook.com/marketplace/112796322073251/search?minPrice=100&maxPrice=8000000&query=Immobilien%20zum%20Kauf&category_id=1270772586445798&exact=false&referral_ui_component=category_menu_item"



# ── Bewertungskriterien ───────────────────────
[kriterien]
text = """
Ich suche eine Immobilie zum Kauf in der Region Dumanjug, Cebu, Philippinen.

Meine Kriterien:
- Preis: unter 8.000.000 PHP (ca. 80.000 EUR) bevorzugt
- Grundstück oder Haus mit Grundstück bevorzugt (kein reines Condo)
- Guter Zustand oder leichter Renovierungsbedarf akzeptabel
- Meerblick oder Meeresnähe ist ein deutliches Plus
- Mindestgröße Grundstück: 200 qm
- Keine Hochwasserzonen oder erkennbare Rechtsstreitigkeiten
"""
